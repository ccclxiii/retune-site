  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {

  a { color: var(--accent); text-underline-offset: 3px; }

  footer { display: flex; align-items: center; gap: 12px; margin-top: 64px; padding: 24px 0 max(40px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }

  footer p { margin: 0; }

  .hero { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 72px 0 24px; text-align: center; }
  .app-icon { display: grid; place-items: center; width: 104px; height: 104px; border-radius: 28px; background: var(--surface); }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .tagline { margin: 0; font-size: 1.25rem; }
  .tagline-el { margin: -10px 0 0; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 12px; }
  .pill { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none; }
  .pill.outline { border: 1px solid var(--line); background: transparent; color: var(--fg); }
